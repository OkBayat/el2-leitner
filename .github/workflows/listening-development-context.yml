name: Listening development context
on:
  push:
    branches: [feature/file-managed-listening-episodes]
    paths: [.github/workflows/listening-development-context.yml]
permissions:
  contents: read
jobs:
  context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 87dba519be0a87e5864d0cf7205cd1dda5a6c357
          persist-credentials: false
      - run: git archive --format=tar.gz HEAD > /tmp/vocora-pr63-current.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: vocora-pr63-current
          path: /tmp/vocora-pr63-current.tar.gz
          retention-days: 1
