name: Listening development context
on:
  push:
    branches: [feature/file-managed-listening-episodes]
    paths: [.github/workflows/listening-development-context.yml]
permissions:
  contents: read
jobs:
  context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix back --no-audit --no-fund && npm ci --prefix ui --no-audit --no-fund
      - run: |
          mkdir -p /tmp/vocora-runtime
          cp "$(command -v node)" /tmp/vocora-runtime/node
          tar -czf /tmp/vocora-dependencies.tar.gz back/node_modules ui/node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: listening-test-dependencies
          path: |
            /tmp/vocora-dependencies.tar.gz
            /tmp/vocora-runtime/node
          retention-days: 1
