name: Listening development context
on:
  push:
    branches: [feature/file-managed-listening-episodes]
    paths: [.github/workflows/listening-development-context.yml]
permissions:
  contents: write
jobs:
  context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/file-managed-listening-episodes
          fetch-depth: 0
      - name: Apply verified implementation patch
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, bz2, hashlib, json, pathlib, subprocess, urllib.request, os
          chunks = ['4d32d416ed16000b088ee80f924ea21832d21c24', '011d12e22669a70e924e62eb352bc70909a6b8f2', '6c3d0108ba95a166fe7cbc73040f930027f10861', '855f260ea12cc60bc7075ab34335b2adbceb3feb']
          compressed = b''
          for sha in chunks:
              url = 'https://api.github.com/repos/OkBayat/vocora/git/blobs/' + sha
              request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'Vocora implementation transfer'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  content = base64.b64decode(json.load(response)['content'])
              assert hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest() == sha
              compressed += content
          patch = bz2.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == 'dda7740f1cdef279c41d1cdc4971a4899fa16025c90761759a9d862f97dd7c0c'
          path = pathlib.Path('/tmp/listening-implementation.patch'); path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', str(path)], check=True)
          episodes = [
              ('260618-limiting-screen-time-for-children.json', '2026-06-18-limiting-screen-time-for-children', 'p0nh80l5', '6c865f4f31e9126486842adb848f0821369677476f36d21ca5d3b77bbce9f8de'),
              ('260903-extreme-weather.json', '2026-09-03-climate-change-extreme-weather', 'p0nmrk4t', '64bba879b02f2ae1ed17755bd1e74d057bb114685e8d7db2a545119003a7cde5')]
          for fixture, folder, image, checksum in episodes:
              source = json.loads(pathlib.Path('back/tests/fixtures/listening', fixture).read_text())
              tests = source['tests']
              for test in tests:
                  test['format'] = 'ielts'; test['difficulty'] = 'medium'
              destination = pathlib.Path('back/data/listening/episodes', folder)
              (destination/'listening.json').write_text(json.dumps({'schemaVersion': 2, 'tests': tests}, ensure_ascii=False, indent=2) + '\n')
              request = urllib.request.Request('https://ichef.bbci.co.uk/images/ic/1200xn/' + image + '.jpg', headers={'User-Agent': 'Vocora episode image verification/1.0'})
              with urllib.request.urlopen(request, timeout=45) as response:
                  picture = response.read()
              assert hashlib.sha256(picture).hexdigest() == checksum, 'BBC cover changed; review before committing'
              (destination/'cover.jpg').write_bytes(picture)
      - name: Commit implementation without new audio or workflow changes
        run: |
          git add -A -- . ':!.github/workflows'
          test -z "$(git diff --cached --diff-filter=AM --name-only -- '*.mp3' '*.zip')"
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add file-managed listening episodes and safe deploy sync'
          git merge origin/main --no-edit
          git push origin HEAD:feature/file-managed-listening-episodes
      - name: Archive combined implementation for verification
        if: always()
        run: git archive --format=tar.gz HEAD > /tmp/vocora-listening-implementation.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vocora-listening-implementation
          path: /tmp/vocora-listening-implementation.tar.gz
          retention-days: 1
