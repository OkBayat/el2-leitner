name: Bootstrap Dependency Sync

on:
  push:
    branches:
      - style/angular-material-default-overrides

permissions:
  contents: write

jobs:
  sync-bootstrap-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install Bootstrap 5.3.8 into the lockfile
        working-directory: ui
        run: npm install bootstrap@5.3.8 --save-exact --package-lock-only --ignore-scripts
      - name: Commit dependency metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/package.json ui/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(ui): install Bootstrap 5.3.8"
            git push
          fi
