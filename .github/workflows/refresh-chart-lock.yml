name: Refresh Chart Lockfile

on:
  push:
    branches:
      - feat/chartjs-leitner-coverage
    paths:
      - ui/package.json
      - .github/workflows/refresh-chart-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Refresh package lock
        working-directory: ui
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- ui/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/package-lock.json
          git commit -m "build(ui): refresh lockfile for Chart.js"
          git push origin HEAD:feat/chartjs-leitner-coverage
