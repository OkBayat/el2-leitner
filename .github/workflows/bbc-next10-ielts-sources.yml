name: BBC next ten IELTS bundle sources
on:
  push:
    branches: [bundle-work/next10-ielts-20260905]
    paths: [.github/workflows/bbc-next10-ielts-sources.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Discover the latest ten missing episodes and fetch verified assets
        run: |
          set -euo pipefail
          mkdir -p /tmp/vocora-next10
          git archive --format=zip --output=/tmp/vocora-next10/repository.zip HEAD
          python3 .agents/skills/vocora-bbc-listening-bundles/scripts/bundle-request.py plan --from-date 2026-01-01 --to-date 2026-09-05 --tests 5 --difficulty-distribution easy=1,medium=2,hard=2 --output /tmp/vocora-next10/request-plan.json
          python3 - <<'PY'
          import concurrent.futures, datetime, email.utils, hashlib, html, json, re, subprocess, sys, time
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          from urllib.request import Request, urlopen
          import xml.etree.ElementTree as ET
          root=Path('/tmp/vocora-next10')
          class Page(HTMLParser):
              def __init__(self, text):
                  super().__init__(); self.links=[]; self.meta={}; self.text=[]; self.hidden=0; self.feed(text)
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag in ('script','style'): self.hidden+=1
                  if tag=='a' and a.get('href'): self.links.append(a['href'])
                  if tag=='meta': self.meta[a.get('property',a.get('name',''))]=a.get('content','')
              def handle_endtag(self, tag):
                  if tag in ('script','style'): self.hidden=max(0,self.hidden-1)
              def handle_data(self, data):
                  if not self.hidden and data.strip(): self.text.append(data.strip())
          def read(url, path):
              host=urlparse(url).hostname or ''
              assert url.startswith('https://') and any(host==d or host.endswith('.'+d) for d in ('bbc.co.uk','bbc.com','bbci.co.uk'))
              for attempt in range(3):
                  try:
                      with urlopen(Request(url,headers={'User-Agent':'Vocora personal-study source verification/1.0'}),timeout=60) as response:
                          body=response.read(5000000); final=response.geturl(); status=response.status
                      break
                  except Exception:
                      if attempt==2: raise
                      time.sleep(2*(attempt+1))
              path.parent.mkdir(parents=True,exist_ok=True); path.write_bytes(body)
              return body, {'url':url,'finalUrl':final,'status':status,'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest()}
          existing=[]; excluded=set()
          for path in sorted(Path('back/data/listening').rglob('*.json')):
              try: obj=json.loads(path.read_text())
              except (ValueError,OSError): continue
              if isinstance(obj,dict) and (obj.get('publicId') or obj.get('id')):
                  record={k:obj.get(k) for k in ('publicId','id','episodeCode','episodeDate','sourceUrl','slug','title')}; record['path']=str(path)
                  existing.append(record)
                  for value in (obj.get('publicId'),obj.get('id'),obj.get('sourceUrl'),obj.get('slug')):
                      if value: excluded.add(value)
                  if obj.get('episodeCode'): excluded.add('bbc-6-minute-english-'+obj['episodeCode'])
          (root/'repository-existing.json').write_text(json.dumps(existing,indent=2))
          feed,feed_record=read('https://podcasts.files.bbci.co.uk/p02pc9tn.rss',root/'feed.xml')
          index,index_record=read('https://www.bbc.co.uk/learningenglish/english/features/6-minute-english_2026',root/'series.html')
          feed_by_code={}
          for item in ET.fromstring(feed).findall('./channel/item'):
              desc=item.findtext('description','')
              pub=email.utils.parsedate_to_datetime(item.findtext('pubDate'))
              for code in re.findall(r'/ep-(\d{6})',desc):
                  feed_by_code[code]={'date':pub.date().isoformat(),'publishedAt':pub.isoformat(),'title':item.findtext('title'),'description':desc,'link':item.findtext('link')}
          candidates={}
          for link in Page(index.decode()).links:
              m=re.search(r'/6-minute-english_2026/ep-(\d{6})(?:$|[?#])',link)
              if m:
                  code=m.group(1)
                  if code<='260905': candidates[code]=urljoin('https://www.bbc.co.uk',link)
          for code,item in feed_by_code.items():
              if not code.startswith('26') or code>'260905': continue
              for link in re.findall(r'https://[^\s\"<>]+',item['description']):
                  if '/ep-'+code in link: candidates.setdefault(code,html.unescape(link))
          selected=[(c,u) for c,u in sorted(candidates.items(),reverse=True) if 'bbc-6-minute-english-'+c not in excluded and u not in excluded][:10]
          assert len(selected)==10, f'Only {len(selected)} missing episodes found'
          def prepare(pair):
              code,url=pair; body,page_record=read(url,root/'references'/code/'page.html'); page=Page(body.decode()); text='\n'.join(page.text)
              assert re.search(r'Episode\s+'+code,text), f'Official identity mismatch: {code}'
              title=page.meta.get('og:title','').split(' / ',1)[-1]
              assert title and '6 Minute English' in page.meta.get('og:title','')
              audio=list(dict.fromkeys(urljoin(url,x) for x in page.links if urlparse(x).path.endswith('.mp3') and '/'+code+'_' in x))
              transcript=list(dict.fromkeys(urljoin(url,x) for x in page.links if urlparse(x).path.endswith('.pdf') and 'transcript' in x and '/'+code+'_' in x))
              assert len(audio)==1 and len(transcript)==1 and page.meta.get('og:image'), f'Missing/ambiguous source assets for {code}: {audio}, {transcript}'
              image=page.meta['og:image']; suffix=Path(urlparse(image).path).suffix
              day=datetime.datetime.strptime(code,'%y%m%d').date().isoformat()
              feed_item=feed_by_code.get(code)
              if feed_item: assert feed_item['date']==day, f'Publication date mismatch {code}'
              slug=re.sub('[^a-z0-9]+','-',title.lower()).strip('-'); assert slug not in excluded
              stage=root/'episodes'/(day+'-'+slug); stage.mkdir(parents=True,exist_ok=True)
              minimal={'title':title,'publicId':'bbc-6-minute-english-'+code,'audioFile':'audio.mp3','imageFile':'cover'+suffix,'sources':{'audioUrl':audio[0],'imageUrl':image,'transcriptUrl':transcript[0]}}
              (stage/'episode.json').write_text(json.dumps(minimal,indent=2))
              subprocess.run([sys.executable,'back/scripts/manage-listening-episode.py','fetch-assets',str(stage)],check=True)
              (root/'references'/code/'page.txt').write_text(text)
              return {'code':code,'date':day,'title':title,'slug':slug,'folder':stage.name,'sourceUrl':url,'sources':minimal['sources'],'imageFile':minimal['imageFile'],'feedEvidence':feed_item,'pageEvidence':page_record,'visibleEpisodeLine':[x for x in page.text if x.startswith('Episode '+code)]}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool: results=list(pool.map(prepare,selected))
          results.sort(key=lambda x:x['date'])
          report={'asOf':'2026-09-05','selection':'Latest ten official episodes absent from repository, descending publication date selection and chronological delivery','repositoryCommit':'111d0d2276ccbb92210b185ebd8121e729f9fd56','existing':existing,'sources':[feed_record,index_record],'candidatesDescending':sorted(candidates,reverse=True),'selected':results,'productionDatabaseChecked':False}
          (root/'discovery.json').write_text(json.dumps(report,indent=2))
          command=[sys.executable,'.agents/skills/vocora-bbc-listening-bundles/scripts/bundle-request.py','bind-discovery','--plan',str(root/'request-plan.json'),'--output',str(root/'bound-plan.json')]
          for ep in results: command.extend(['--episode',ep['date']+'=bbc-6-minute-english-'+ep['code']])
          subprocess.run(command,check=True)
          print(json.dumps([{'date':e['date'],'title':e['title']} for e in results],indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: next10-sources-internal-not-deliverable
          path: /tmp/vocora-next10/
          retention-days: 2
          compression-level: 0
      - name: Install local audio-location tool
        run: python3 -m pip install --disable-pip-version-check faster-whisper==1.2.1
      - name: Locate spoken passages in the direct lesson recordings
        env:
          HF_HUB_DISABLE_XET: '1'
          OMP_NUM_THREADS: '4'
        run: |
          python3 -u - <<'PY'
          import hashlib, json, time
          from pathlib import Path
          from faster_whisper import WhisperModel
          root=Path('/tmp/vocora-next10'); output=root/'timing'; output.mkdir()
          model=WhisperModel('small.en',device='cpu',compute_type='int8',cpu_threads=4)
          for ep in json.loads((root/'discovery.json').read_text())['selected']:
              audio=root/'episodes'/ep['folder']/'audio.mp3'; started=time.monotonic()
              segments,info=model.transcribe(str(audio),language='en',word_timestamps=True,beam_size=3,vad_filter=True)
              rows=[]
              for s in segments:
                  rows.append({'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]})
              result={'episodeCode':ep['code'],'audioSha256':hashlib.sha256(audio.read_bytes()).hexdigest(),'durationSeconds':info.duration,'method':'faster-whisper small.en CPU int8 word timestamps; source meaning requires separate official-reference review','segments':rows}
              (output/(ep['code']+'.json')).write_text(json.dumps(result,indent=2))
              print(ep['code'],len(rows),'segments',round(time.monotonic()-started,1),'seconds',flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next10-audio-locations-internal
          path: /tmp/vocora-next10/timing/
          retention-days: 2
