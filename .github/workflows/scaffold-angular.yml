name: Scaffold Angular Frontend

on:
  push:
    branches:
      - refactor/angular-material-frontend
    paths:
      - '.github/workflows/scaffold-angular.yml'

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/angular-material-frontend
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Generate Angular 22 workspace
        run: |
          set -euo pipefail
          rm -rf /tmp/vocora-angular
          cd /tmp
          npx -y @angular/cli@22.1.4 new vocora-angular \
            --standalone \
            --routing \
            --style=scss \
            --strict \
            --skip-git \
            --skip-tests=false \
            --package-manager=npm \
            --ssr=false \
            --defaults
          cd /tmp/vocora-angular
          npm install --save-exact @angular/material@22.1.4 @angular/cdk@22.1.4
          npm install --save-dev --save-exact @playwright/test@1.55.0 jsdom@26.1.0
      - name: Copy generated workspace without deleting legacy regression fixtures
        run: |
          set -euo pipefail
          cp /tmp/vocora-angular/angular.json ui/angular.json
          cp /tmp/vocora-angular/tsconfig.json ui/tsconfig.json
          cp /tmp/vocora-angular/tsconfig.app.json ui/tsconfig.app.json
          cp /tmp/vocora-angular/tsconfig.spec.json ui/tsconfig.spec.json
          cp /tmp/vocora-angular/package.json ui/package.json
          cp /tmp/vocora-angular/package-lock.json ui/package-lock.json
          rm -rf ui/src
          cp -R /tmp/vocora-angular/src ui/src
          mkdir -p ui/public
          cp -R /tmp/vocora-angular/public/. ui/public/
          rm -rf ui/public/assets ui/public/fonts ui/public/data
          cp -R ui/assets ui/public/assets
          cp -R ui/fonts ui/public/fonts
          cp -R ui/data ui/public/data
          node <<'NODE'
          const fs = require('fs');
          const path = 'ui/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.name = 'vocora-ui';
          pkg.version = '3.0.0';
          pkg.description = 'Vocora Angular frontend';
          pkg.scripts = {
            start: 'ng serve --proxy-config proxy.conf.json',
            build: 'ng build',
            'build:production': 'ng build --configuration production',
            test: 'ng test --watch=false --coverage',
            'test:unit': 'ng test --watch=false',
            e2e: 'playwright test',
            'e2e:headed': 'playwright test --headed',
            'check:architecture': 'node tests/test-angular-architecture.mjs',
            'test:legacy': 'node tests/test-review-progress.mjs && node tests/test-leitner-graduation.mjs && node tests/test-leitner-same-day-terminal.mjs && node tests/test-leitner-production-persistence.mjs && node tests/test-historical-mastery-repair.mjs && node tests/test-leitner-status.mjs && node tests/test-leitner-wait-day-states.mjs && node tests/test-practice-remediation.mjs && node tests/test-practice-remediation-adapter.mjs && node tests/test-remediation-keyboard-guard.mjs && node tests/test-practice-remediation-recheck-prompt.mjs && node tests/test-session-persistence.mjs && node tests/test-review-write-adapter.mjs'
          };
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          cd ui
          npm install --package-lock-only --ignore-scripts
      - name: Commit generated foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/angular.json ui/tsconfig*.json ui/package.json ui/package-lock.json ui/src ui/public
          git commit -m "build(ui): generate Angular 22 workspace with Material"
          git push origin HEAD:refactor/angular-material-frontend
