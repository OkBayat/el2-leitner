name: Temporary IELTS source review
on:
  push:
    branches: [fix/ielts-listening-question-redesign]
    paths: [.github/workflows/ielts-authoring-review-temporary.yml]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install audio inspection tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Locate speech without the initial voice-activity filter
        run: |
          python3 -m venv /tmp/ielts-asr
          /tmp/ielts-asr/bin/pip -q install faster-whisper
          /tmp/ielts-asr/bin/python - <<'PY'
          import hashlib, json, subprocess, sys
          from pathlib import Path
          from faster_whisper import WhisperModel
          root=Path('/tmp/ielts-review')
          target=root/'media'/'2026-07-02-rude-emails'; target.mkdir(parents=True)
          source=Path('back/data/listening/episodes/2026-07-02-rude-emails/episode.json')
          data=json.loads(source.read_text()); (target/'episode.json').write_text(source.read_text())
          subprocess.run([sys.executable,'back/scripts/manage-listening-episode.py','fetch-assets',str(target)],check=True)
          duration=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',str(target/'audio.mp3')],text=True))
          ep={'code':'260702','folder':target.name,'sourceUrl':data['sourceUrl'],'audioSha256':hashlib.sha256((target/'audio.mp3').read_bytes()).hexdigest(),'durationSeconds':duration}
          model=WhisperModel('small.en',device='cpu',compute_type='int8',cpu_threads=4)
          segments,info=model.transcribe(str(target/'audio.mp3'),language='en',beam_size=5,word_timestamps=True,vad_filter=False,condition_on_previous_text=False)
          result={'episode':ep,'method':'ASR location assistance without VAD; official reference remains answer authority','segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in (s.words or [])]} for s in segments]}
          (root/'timing').mkdir(); (root/'timing'/'260702.json').write_text(json.dumps(result,indent=2))
          print('Source intervals',len(result['segments']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: internal-ielts-corrected-email-timing
          path: /tmp/ielts-review/timing/
          retention-days: 3
