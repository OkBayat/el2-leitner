name: Listening continuation workspace
on:
  push:
    branches: [feature/file-managed-listening-episodes]
    paths: [.github/workflows/listening-continuation-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked sources for isolated verification
        run: git archive --format=tar.gz HEAD > /tmp/vocora-continuation.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: listening-continuation-workspace
          path: /tmp/vocora-continuation.tar.gz
          retention-days: 1
