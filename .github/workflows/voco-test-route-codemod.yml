name: Voco test route codemod
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  update-test-entry-points:
    if: github.event.pull_request.number == 76 && github.event.pull_request.head.ref == 'voco' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Apply the bounded one-time route migration
        run: node .github/scripts/voco-test-route-codemod.mjs
      - name: Validate changed test syntax
        run: |
          git diff --check
          node --check back/tests/integration/home-timeline.mysql.test.js
          cd ui
          npm ci --no-audit --no-fund
          npx playwright test --list
      - name: Commit only the requested test entry-point updates
        run: |
          git config --local user.name 'github-actions[bot]'
          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ui/e2e/vocora.spec.ts ui/e2e/sentence-practice.spec.ts ui/e2e/sentence-answer.spec.ts ui/e2e/shadowing.spec.ts ui/e2e/shadowing-audio.spec.ts back/tests/integration/home-timeline.mysql.test.js
          git diff --cached --stat
          git commit -m 'test(home): migrate existing practice entry points without changing assertions'
          git push origin HEAD:refs/heads/voco
