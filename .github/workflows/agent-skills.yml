name: Agent skills

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.agents/**'
      - '.github/workflows/agent-skills.yml'
  push:
    branches:
      - feature/agent-guides-bbc-bundle-skill
    paths:
      - 'AGENTS.md'
      - '.agents/**'
      - '.github/workflows/agent-skills.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate BBC bundle skill architecture
        run: python3 .agents/skills/k2-bbc-listening-bundles/scripts/validate-skill.py
      - name: Run BBC bundle skill tests
        run: |
          python3 .agents/skills/k2-bbc-listening-bundles/scripts/test-bundle-request.py
          python3 .agents/skills/k2-bbc-listening-bundles/scripts/test-validate-skill.py
      - name: Validate changed skill architecture
        if: github.event_name == 'pull_request'
        run: node .agents/skills/k2-skill-architecture/scripts/validate-skill-architecture.js --base "${{ github.event.pull_request.base.sha }}" --head HEAD
      - name: Validate lesson exercise design skill architecture
        run: python3 .agents/skills/k2-lesson-exercise-design/scripts/validate-skill.py
      - name: Run lesson exercise design skill tests
        run: |
          python3 .agents/skills/k2-lesson-exercise-design/scripts/test-validate-lesson-plan.py
          python3 .agents/skills/k2-lesson-exercise-design/scripts/test-validate-skill.py
