name: Angular E2E

on:
  pull_request:
    paths:
      - 'back/**'
      - 'ui/**'
      - 'speech/**'
      - 'scripts/**'
      - '.dockerignore'
      - '.env.example'
      - 'docker-compose.yml'
      - '.github/workflows/angular-e2e.yml'
  push:
    branches:
      - main
    paths:
      - 'back/**'
      - 'ui/**'
      - 'speech/**'
      - 'scripts/**'
      - '.dockerignore'
      - '.env.example'
      - 'docker-compose.yml'
      - '.github/workflows/angular-e2e.yml'

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: ci-application-password
      DB_ADMIN_PASSWORD: ci-root-password
      MYSQL_ROOT_PASSWORD: ci-root-password
      JWT_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      LIBRARY_ADMIN_EMAILS: e2e-admin@example.com
      AUTH_RATE_LIMIT_MAX: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Pin Playwright AudioWorklet fix
        working-directory: ui
        # Playwright 1.55 can leave AudioWorklet.addModule() pending forever in CI.
        # Patch the clean dependency manifest and lockfile before npm ci so npm
        # installs the upstream-fixed 1.56.1 without mutating an installed tree.
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));

          packageJson.devDependencies['@playwright/test'] = '1.56.1';
          lock.packages[''].devDependencies['@playwright/test'] = '1.56.1';

          Object.assign(lock.packages['node_modules/@playwright/test'], {
            version: '1.56.1',
            resolved: 'https://registry.npmjs.org/@playwright/test/-/test-1.56.1.tgz',
            integrity: 'sha512-vSMYtL/zOcFpvJCW71Q/OEGQb7KYBPAdKh35WNSkaZA75JlAO8ED8UN6GUNTm3drWomcbcqRPFqQbLae8yBTdg=='
          });
          lock.packages['node_modules/@playwright/test'].dependencies.playwright = '1.56.1';

          Object.assign(lock.packages['node_modules/playwright'], {
            version: '1.56.1',
            resolved: 'https://registry.npmjs.org/playwright/-/playwright-1.56.1.tgz',
            integrity: 'sha512-aFi5B0WovBHTEvpM3DzXTUaeN6eN0qWnTkKx4NQaH4Wvcmc153PdaY2UBdSYKaGYw+UyWXSVyxDUg5DoPEttjw=='
          });
          lock.packages['node_modules/playwright'].dependencies['playwright-core'] = '1.56.1';

          Object.assign(lock.packages['node_modules/playwright-core'], {
            version: '1.56.1',
            resolved: 'https://registry.npmjs.org/playwright-core/-/playwright-core-1.56.1.tgz',
            integrity: 'sha512-hutraynyn31F+Bifme+Ps9Vq59hKuUCz7H1kDOcBs+2oGguKkWTU50bBWrtz34OUWmIwpBTWDxaRPXrIXkgvmQ=='
          });

          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 4)}\n`);
          fs.writeFileSync('package-lock.json', `${JSON.stringify(lock, null, 4)}\n`);
          NODE
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start production stack
        run: |
          docker compose up --build --detach
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color
          exit 1
      - name: Run Angular E2E suite
        working-directory: ui
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: angular-playwright-report
          path: |
            ui/playwright-report
            ui/test-results
          if-no-files-found: ignore
      - name: Print container logs after a failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
