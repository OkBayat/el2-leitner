name: Angular E2E

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: ci-application-password
      DB_ADMIN_PASSWORD: ci-root-password
      MYSQL_ROOT_PASSWORD: ci-root-password
      JWT_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      LIBRARY_ADMIN_EMAILS: e2e-admin@example.com
      AUTH_RATE_LIMIT_MAX: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci
      - name: Use AudioWorklet-safe Playwright
        working-directory: ui
        # Playwright 1.55 can leave AudioWorklet.addModule() pending forever in CI.
        # 1.56 contains the upstream fix; keep this exact CI override until the
        # repository dependency is upgraded separately.
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Playwright Chromium
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start production stack
        run: |
          docker compose up --build --detach
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color
          exit 1
      - name: Run Angular E2E suite
        working-directory: ui
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: angular-playwright-report
          path: |
            ui/playwright-report
            ui/test-results
          if-no-files-found: ignore
      - name: Print container logs after a failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
