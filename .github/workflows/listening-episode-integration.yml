name: Listening episode integration
on:
  pull_request:
    paths:
      - 'back/data/listening/**'
      - 'back/src/application/listening-practice/**'
      - 'back/src/domain/listening-practice/**'
      - 'back/src/infrastructure/content/**'
      - 'back/src/infrastructure/persistence/mysql/MySqlListening*.js'
      - 'back/src/interfaces/http/resolveListeningAsset.js'
      - 'back/src/interfaces/http/apiRouter.js'
      - 'back/src/container.js'
      - 'back/src/createApp.js'
      - 'back/src/config/**'
      - 'back/database/**'
      - 'back/scripts/manage-listening-episode.py'
      - 'back/scripts/validate-listening-lessons.js'
      - 'back/scripts/setup-database.js'
      - 'back/scripts/verify-database.js'
      - 'back/package*.json'
      - 'back/tests/**/*listening*'
      - '.github/workflows/listening-episode-integration.yml'
  push:
    branches: [main]
    paths:
      - 'back/data/listening/**'
      - 'back/src/application/listening-practice/**'
      - 'back/src/domain/listening-practice/**'
      - 'back/src/infrastructure/content/**'
      - 'back/src/infrastructure/persistence/mysql/MySqlListening*.js'
      - 'back/src/interfaces/http/resolveListeningAsset.js'
      - 'back/src/interfaces/http/apiRouter.js'
      - 'back/src/container.js'
      - 'back/src/createApp.js'
      - 'back/src/config/**'
      - 'back/database/**'
      - 'back/scripts/manage-listening-episode.py'
      - 'back/scripts/validate-listening-lessons.js'
      - 'back/scripts/setup-database.js'
      - 'back/scripts/verify-database.js'
      - 'back/package*.json'
      - 'back/tests/**/*listening*'
      - '.github/workflows/listening-episode-integration.yml'
permissions:
  contents: read
jobs:
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: vocora_episodes_ci
          MYSQL_USER: vocora_ci
          MYSQL_PASSWORD: integration-only-password
          MYSQL_ROOT_PASSWORD: integration-only-root
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=integration-only-root --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: vocora_episodes_ci
      DB_USER: vocora_ci
      DB_PASSWORD: integration-only-password
      DB_ADMIN_USER: root
      DB_ADMIN_PASSWORD: integration-only-root
      LISTENING_MYSQL_INTEGRATION: '1'
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: back/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run db:setup
      - run: node --test tests/integration/listening-episodes.mysql.test.js
      - run: npm run db:verify
