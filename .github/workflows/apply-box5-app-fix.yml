name: Apply Box Five App Fix

on:
  push:
    branches:
      - agent/fix-server-side-box5-mastery-repair
    paths:
      - .github/workflows/apply-box5-app-fix.yml

permissions:
  contents: write

jobs:
  patch-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-server-side-box5-mastery-repair

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Patch terminal house-five transition in app-v2
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('ui/app-v2.js')
          text = path.read_text()

          legacy_old = "const eligible = word.due && word.due <= day && (!word.blockedUntil || word.blockedUntil <= day) && word.lastPromotedDay !== day;"
          legacy_new = "const eligible = word.due && word.due <= day && (!word.blockedUntil || word.blockedUntil <= day) && (word.box === 5 || word.lastPromotedDay !== day);"
          if text.count(legacy_old) != 1:
              raise SystemExit(f'Expected exactly one legacy eligibility guard, found {text.count(legacy_old)}')
          text = text.replace(legacy_old, legacy_new)

          live_old = """        && (!currentWord.blockedUntil || currentWord.blockedUntil <= today)\n        && currentWord.lastPromotedDay !== today;"""
          live_new = """        && (!currentWord.blockedUntil || currentWord.blockedUntil <= today)\n        // Intermediate houses may promote only once per day. House 5 is terminal:\n        // if its final review is due, a stale same-day promotion marker must not\n        // schedule the card again instead of graduating it.\n        && (previousBox === 5 || currentWord.lastPromotedDay !== today);"""
          if text.count(live_old) != 1:
              raise SystemExit(f'Expected exactly one live eligibility guard, found {text.count(live_old)}')
          text = text.replace(live_old, live_new)

          path.write_text(text)
          PY

      - name: Run the direct regression
        working-directory: ui
        run: |
          npm ci
          node tests/test-leitner-same-day-terminal.mjs
          npm test

      - name: Commit and push the production fix
        run: |
          git config user.name "Mohammad Bayat"
          git config user.email "OkBayat@gmail.com"
          git add ui/app-v2.js
          git diff --cached --check
          git commit -m "fix: graduate due house-five cards on same-day marker"
          git push origin HEAD:agent/fix-server-side-box5-mastery-repair
