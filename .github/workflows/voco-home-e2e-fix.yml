name: Voco Home E2E fix
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  apply:
    if: github.event.pull_request.number == 76 && github.event.pull_request.head.ref == 'voco' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply bounded E2E route fixes
        run: node .github/scripts/voco-home-e2e-fix.mjs
      - name: Validate and commit
        run: |
          git diff --check
          rm .github/workflows/voco-home-e2e-fix.yml .github/scripts/voco-home-e2e-fix.mjs
          git config --local user.name 'github-actions[bot]'
          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ui/e2e/bbc-listening.spec.ts ui/e2e/episode-vocabulary.spec.ts ui/src/app/features/home/home-page.component.scss .github/workflows/voco-home-e2e-fix.yml .github/scripts/voco-home-e2e-fix.mjs
          git commit -m 'test(home): enter listening from the daily path'
          git push origin HEAD:refs/heads/voco
