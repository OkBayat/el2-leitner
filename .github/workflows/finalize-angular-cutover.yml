name: Finalize Angular Cutover

on:
  push:
    branches:
      - refactor/angular-material-frontend
    paths:
      - '.github/workflows/finalize-angular-cutover.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/angular-material-frontend
      - name: Remove legacy frontend and redirect CI vocabulary fixture
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/test.yml')
          text = workflow.read_text()
          text = text.replace("          globalThis.window = {};\n          await import('./ui/vocabulary.js');\n          const words = window.IELTS_CORE_WORDS.map((source, index) => ({", "          const { loadCoreVocabulary } = await import('./ui/tools/ci-vocabulary.mjs');\n          const words = loadCoreVocabulary().map((source, index) => ({")
          workflow.write_text(text)
          PY

          rm -f \
            ui/app-v2.js \
            ui/auth.js ui/auth.css \
            ui/index.html \
            ui/login.html ui/register.html \
            ui/library.html ui/library.js ui/library.css ui/library-integration.css ui/library-import-template.js \
            ui/leitner-house.html ui/leitner-house.js ui/leitner-house.css \
            ui/leitner-status.js ui/leitner-status.css \
            ui/practice-remediation.js ui/practice-remediation.css \
            ui/practice-remediation-adapter.js ui/practice-remediation-keyboard-guard.js ui/practice-remediation-recheck-prompt.js \
            ui/session-persistence.js \
            ui/share-story-v2.js \
            ui/styles-v2.css ui/styles.css \
            ui/vocabulary.js ui/word-collections.js \
            ui/tools/build-vocabulary.mjs

          find ui/tests -type f ! -name 'test-angular-architecture.mjs' -delete
          rm -f .github/workflows/scaffold-angular.yml

          cat >> .gitignore <<'EOF'
          ui/dist/
          ui/.angular/
          ui/playwright-report/
          ui/test-results/
          EOF
          awk '!seen[$0]++' .gitignore > .gitignore.tmp && mv .gitignore.tmp .gitignore
      - name: Commit cutover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(ui): remove legacy browser runtime"
          git push origin HEAD:refactor/angular-material-frontend
