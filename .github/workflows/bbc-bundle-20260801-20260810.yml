name: BBC bundle 2026-08-01 through 2026-08-10

on:
  push:
    branches: [bundle-work/20260801-20260810-20260905]
    paths:
      - .github/workflows/bbc-bundle-20260801-20260810.yml

permissions:
  contents: read

jobs:
  fetch-verified-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Stage the verified episode metadata outside the repository
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'vocora-assets' / '2026-08-06-how-do-climate-scientists-make-predictions'
          directory.mkdir(parents=True)
          metadata = {
              'schemaVersion': 1,
              'publicId': 'bbc-6-minute-english-260806',
              'provider': 'bbc_6_minute_english',
              'slug': 'how-do-climate-scientists-make-predictions',
              'title': 'How do climate scientists make predictions?',
              'description': 'Explore how computer models describe possible future climates, why clouds can both cool and warm the planet, and how scientific understanding can guide human action. Practise with five independently authored IELTS-style listening tests.',
              'episodeCode': '260806',
              'episodeDate': '2026-08-06',
              'publishedAt': '2026-08-06T09:11:00Z',
              'sourceUrl': 'https://www.bbc.co.uk/learningenglish/english/features/6-minute-english_2026/ep-260806',
              'status': 'published',
              'level': 'intermediate',
              'audioFile': 'audio.mp3',
              'imageFile': 'cover.jpg',
              'sources': {
                  'audioUrl': 'https://downloads.bbc.co.uk/learningenglish/features/6min/260806_6_minute_english_how_do_climate_scientists_make_predictions_download.mp3',
                  'imageUrl': 'https://ichef.bbci.co.uk/images/ic/1200xn/p0p2sfsv.jpg',
                  'transcriptUrl': 'https://downloads.bbc.co.uk/learningenglish/features/6min/260806_6_minute_english_how_do_climate_scientists_make_predictions_transcript.pdf',
                  'vocabularyUrl': 'https://www.bbc.co.uk/learningenglish/english/features/6-minute-english_2026/ep-260806',
                  'attribution': 'BBC Learning English, 6 Minute English. Original audio and image copyright BBC. The source page labels the programme Intermediate level. Vocora test difficulties, questions, definitions and examples are independently authored practice, not official IELTS materials.',
                  'retrievedAt': '2026-09-05T12:52:48Z',
              },
          }
          (directory / 'episode.json').write_text(json.dumps(metadata, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Fetch the actual episode cover and lesson MP3
        run: |
          python3 back/scripts/manage-listening-episode.py fetch-assets \
            "$RUNNER_TEMP/vocora-assets/2026-08-06-how-do-climate-scientists-make-predictions"
      - uses: actions/upload-artifact@v4
        with:
          name: vocora-bbc-verified-media-260806
          path: ${{ runner.temp }}/vocora-assets
          if-no-files-found: error
          retention-days: 3
