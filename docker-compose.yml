name: leitner-ielts

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-leitner_ielts}
      MYSQL_USER: ${DB_USER:-leitner_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      # MySQL is not published to the host; this lets only containers on the
      # private Compose network run the administrative setup.
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping --host=127.0.0.1 --user=root --password=$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - app_network

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      UPLOAD_LIMIT: 16M
    ports:
      - "${PHPMYADMIN_HOST:-0.0.0.0}:${PHPMYADMIN_PORT:-8081}:80"
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "$$s=@fsockopen('127.0.0.1',80); if(!$$s) exit(1); fclose($$s);",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app_network

  db-setup:
    build:
      context: .
      dockerfile: back/Dockerfile
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    command: ["npm", "run", "db:setup"]
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-leitner_ielts}
      DB_USER: ${DB_USER:-leitner_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_ADMIN_USER: ${DB_ADMIN_USER:-root}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:?Set DB_ADMIN_PASSWORD in .env}
      DB_CONNECT_RETRIES: ${DB_CONNECT_RETRIES:-30}
      DB_CONNECT_RETRY_MS: ${DB_CONNECT_RETRY_MS:-2000}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-10}
      LISTENING_EPISODES_DIRECTORY: /app/back/data/listening/episodes
    volumes:
      - ./back/data/listening/episodes:/app/back/data/listening/episodes:ro
    networks:
      - app_network

  speech:
    build:
      context: ./speech
    restart: unless-stopped
    networks:
      - app_network

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:${KOKORO_IMAGE_TAG:-v0.8.2}
    restart: unless-stopped
    environment:
      API_LOG_LEVEL: ${KOKORO_API_LOG_LEVEL:-INFO}
      ENABLE_WEB_PLAYER: "false"
      ENABLE_DEBUG_ENDPOINTS: "false"
      ALLOW_DEV_UNLOAD: "false"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8880/health', timeout=5)",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks:
      - app_network

  app:
    build:
      context: .
      dockerfile: back/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
      kokoro:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-leitner_ielts}
      DB_USER: ${DB_USER:-leitner_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-10}
      LISTENING_EPISODES_DIRECTORY: /app/back/data/listening/episodes
      SHADOWING_SPEECH_URL: ${SHADOWING_SPEECH_URL:-http://speech:8080}
      KOKORO_TTS_URL: ${KOKORO_TTS_URL:-http://kokoro:8880}
      KOKORO_TTS_MODEL: ${KOKORO_TTS_MODEL:-kokoro}
      TTS_CACHE_DIRECTORY: /app/back/data/tts-cache
      TTS_ALLOWED_VOICES: ${TTS_ALLOWED_VOICES:-af_bella,af_heart,af_sky,bf_emma}
      TTS_DEFAULT_VOICE: ${TTS_DEFAULT_VOICE:-af_heart}
      TTS_DEFAULT_SPEED: ${TTS_DEFAULT_SPEED:-1}
      TTS_DEFAULT_FORMAT: ${TTS_DEFAULT_FORMAT:-mp3}
      TTS_REQUEST_TIMEOUT_MS: ${TTS_REQUEST_TIMEOUT_MS:-120000}
      TTS_MAX_TEXT_LENGTH: ${TTS_MAX_TEXT_LENGTH:-5000}
      TTS_MODEL_VERSION: ${TTS_MODEL_VERSION:-kokoro-v1.0@kokoro-fastapi-v0.8.2}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-leitner_session}
      AUTH_COOKIE_MAX_AGE_MS: ${AUTH_COOKIE_MAX_AGE_MS:-604800000}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-900000}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost,capacitor://localhost}
      MOBILE_ANDROID_LATEST_VERSION: ${MOBILE_ANDROID_LATEST_VERSION:-}
      MOBILE_ANDROID_MINIMUM_SUPPORTED_VERSION: ${MOBILE_ANDROID_MINIMUM_SUPPORTED_VERSION:-}
      MOBILE_ANDROID_STORE_URL: ${MOBILE_ANDROID_STORE_URL:-}
      MOBILE_IOS_LATEST_VERSION: ${MOBILE_IOS_LATEST_VERSION:-}
      MOBILE_IOS_MINIMUM_SUPPORTED_VERSION: ${MOBILE_IOS_MINIMUM_SUPPORTED_VERSION:-}
      MOBILE_IOS_STORE_URL: ${MOBILE_IOS_STORE_URL:-}
      LIBRARY_ADMIN_EMAILS: ${LIBRARY_ADMIN_EMAILS:-}
    volumes:
      - ./back/data/listening/audio:/app/back/data/listening/audio:ro
      - ./back/data/listening/episodes:/app/back/data/listening/episodes:ro
      - tts_audio_cache:/app/back/data/tts-cache
    ports:
      - "${APP_HOST:-0.0.0.0}:${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app_network

volumes:
  mysql_data:
  tts_audio_cache:

networks:
  app_network:
    driver: bridge
