<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f9ff">
  <title>ثبت‌نام | واژه‌یار IELTS</title>
  <link rel="icon" href="assets/vocora-icon.png" type="image/png" sizes="384x384">
  <link rel="apple-touch-icon" href="assets/vocora-icon.png">
  <link rel="stylesheet" href="src/features/auth/presentation/auth.css">
  <link rel="stylesheet" href="src/design-system/material3.css">
</head>
<body data-auth-mode="register">
  <main class="auth-page">
    <section class="auth-panel" aria-labelledby="authTitle">
      <a class="brand" href="login.html" aria-label="Vocora"><img class="brand-logo" src="assets/vocora-logo.png" alt="Vocora" width="185" height="46"></a>
      <div class="auth-copy"><h1 id="authTitle">ساخت حساب</h1><p>فقط با ایمیل و رمز عبور، تمرینت را شروع کن.</p></div>
      <form class="auth-form" id="authForm" novalidate>
        <md-outlined-text-field id="email" name="email" type="email" label="ایمیل" inputmode="email" autocomplete="email" placeholder="name@example.com" dir="ltr" required></md-outlined-text-field>
        <md-outlined-text-field id="password" name="password" type="password" label="رمز عبور" autocomplete="new-password" supporting-text="حداقل ۸ کاراکتر" dir="ltr" required></md-outlined-text-field>
        <p class="auth-message" id="authMessage" role="alert" aria-live="polite" hidden></p>
        <md-filled-button id="authSubmit" type="submit">ساخت حساب</md-filled-button>
      </form>
      <p class="auth-switch">قبلاً حساب ساخته‌ای؟ <a href="login.html">وارد شو</a></p>
    </section>
    <aside class="auth-visual" aria-hidden="true"><div class="visual-content"><span>شروع ساده، رشد قابل‌اندازه‌گیری</span><h2>جعبهٔ لایتنر شخصی تو همیشه همراهت است</h2><p>داده‌ها در حساب تو ذخیره می‌شوند؛ بدون وابستگی به یک مرورگر یا دستگاه.</p></div></aside>
  </main>
  <script type="module" src="./dist/material-web.js"></script>
  <script type="module" src="./src/features/auth/index.js"></script>
</body>
</html>
