<ng-template #content><ng-content /></ng-template>

@if (kind === 'link' && routerLink() !== null) {
  <a
    #control
    mat-flat-button
    class="voco-button voco-button--{{ variant }}"
    [routerLink]="routerLink()"
    [target]="target()"
    [rel]="rel()"
    [disabled]="disabled()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-describedby]="ariaDescribedBy()"
    [attr.aria-current]="ariaCurrent()"
    [attr.title]="title()"
    (click)="onControlClick($event)"
  ><ng-container [ngTemplateOutlet]="content" /></a>
} @else if (kind === 'link') {
  <a
    #control
    mat-flat-button
    class="voco-button voco-button--{{ variant }}"
    [href]="href()"
    [target]="target()"
    [rel]="rel()"
    [disabled]="disabled()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-describedby]="ariaDescribedBy()"
    [attr.aria-current]="ariaCurrent()"
    [attr.title]="title()"
    (click)="onControlClick($event)"
  ><ng-container [ngTemplateOutlet]="content" /></a>
} @else if (kind === 'icon-link' && routerLink() !== null) {
  <a
    #control
    mat-icon-button
    class="voco-icon-button voco-icon-button--{{ iconTone() }} voco-icon-button--{{ iconSize() }}"
    [class.voco-icon-button--selected]="selected()"
    [routerLink]="routerLink()"
    [target]="target()"
    [rel]="rel()"
    [disabled]="disabled()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-describedby]="ariaDescribedBy()"
    [attr.aria-current]="ariaCurrent()"
    [attr.title]="title()"
    (click)="onControlClick($event)"
  ><ng-container [ngTemplateOutlet]="content" /></a>
} @else if (kind === 'icon-link') {
  <a
    #control
    mat-icon-button
    class="voco-icon-button voco-icon-button--{{ iconTone() }} voco-icon-button--{{ iconSize() }}"
    [class.voco-icon-button--selected]="selected()"
    [href]="href()"
    [target]="target()"
    [rel]="rel()"
    [disabled]="disabled()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-describedby]="ariaDescribedBy()"
    [attr.aria-current]="ariaCurrent()"
    [attr.title]="title()"
    (click)="onControlClick($event)"
  ><ng-container [ngTemplateOutlet]="content" /></a>
} @else if (kind === 'icon') {
  <button
    #control
    mat-icon-button
    class="voco-icon-button voco-icon-button--{{ iconTone() }} voco-icon-button--{{ iconSize() }}"
    [class.voco-icon-button--selected]="selected()"
    [type]="type()"
    [disabled]="disabled()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-describedby]="ariaDescribedBy()"
    [attr.aria-busy]="ariaBusy()"
    [attr.aria-controls]="ariaControls()"
    [attr.aria-expanded]="ariaExpanded()"
    [attr.aria-pressed]="ariaPressed()"
    [attr.title]="title()"
    (click)="onControlClick($event)"
  ><ng-container [ngTemplateOutlet]="content" /></button>
} @else if (kind === 'audio') {
  <button
    #control
    mat-flat-button
    class="voco-audio-button voco-audio-button--{{ audioSize() }}"
    [type]="type()"
    [disabled]="disabled()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-describedby]="ariaDescribedBy()"
    [attr.aria-busy]="ariaBusy()"
    [attr.aria-pressed]="ariaPressed()"
    [attr.title]="title()"
    (click)="onControlClick($event)"
  ><ng-container [ngTemplateOutlet]="content" /></button>
} @else {
  <button
    #control
    mat-flat-button
    class="voco-button voco-button--{{ variant }}"
    [type]="type()"
    [disabled]="disabled()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-describedby]="ariaDescribedBy()"
    [attr.aria-busy]="ariaBusy()"
    [attr.aria-controls]="ariaControls()"
    [attr.aria-expanded]="ariaExpanded()"
    [attr.aria-pressed]="ariaPressed()"
    [attr.title]="title()"
    (click)="onControlClick($event)"
  ><ng-container [ngTemplateOutlet]="content" /></button>
}
