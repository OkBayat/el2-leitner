<ng-template #content><ng-content /></ng-template>

@if (routerLink !== null) {
  <a
    mat-flat-button
    class="voco-button voco-button--{{ intent }}"
    [disabled]="disabled"
    [routerLink]="disabled ? null : routerLink"
    [queryParams]="queryParams"
    [target]="target"
    [attr.rel]="rel"
    [attr.aria-label]="ariaLabel"
    [attr.aria-describedby]="ariaDescribedBy"
    [attr.aria-current]="ariaCurrent"
    [attr.aria-disabled]="disabled ? 'true' : null"
    [attr.tabindex]="disabled ? -1 : null"
    [attr.title]="title"
    (click)="onControlClick($event)"
    (keydown.enter)="onDisabledKeydown($event)"
    (keydown.space)="onDisabledKeydown($event)"
  ><ng-container [ngTemplateOutlet]="content" /></a>
} @else {
  <a
    mat-flat-button
    class="voco-button voco-button--{{ intent }}"
    [disabled]="disabled"
    [attr.href]="disabled ? null : href"
    [target]="target"
    [attr.rel]="rel"
    [attr.aria-label]="ariaLabel"
    [attr.aria-describedby]="ariaDescribedBy"
    [attr.aria-current]="ariaCurrent"
    [attr.aria-disabled]="disabled ? 'true' : null"
    [attr.tabindex]="disabled ? -1 : null"
    [attr.title]="title"
    (click)="onControlClick($event)"
    (keydown.enter)="onDisabledKeydown($event)"
    (keydown.space)="onDisabledKeydown($event)"
  ><ng-container [ngTemplateOutlet]="content" /></a>
}
