<button
  class="exercise-action"
  type="button"
  [attr.data-state]="state()"
  [attr.aria-label]="ariaLabel() || null"
  [attr.aria-busy]="loading() ? 'true' : null"
  [disabled]="state() === 'disabled'"
  (click)="activate()"
>
  @if (loading()) {
    <span class="exercise-action__spinner" aria-hidden="true"></span>
  }
  <span class="exercise-action__label"><ng-content></ng-content></span>
</button>
