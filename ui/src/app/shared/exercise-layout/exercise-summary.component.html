<section class="exercise-summary" data-testid="exercise-summary">
  <div class="exercise-summary__visual">
    <ng-content select="[exerciseSummaryVisual]"></ng-content>
  </div>

  <div class="exercise-summary__copy">
    @if (eyebrow()) { <p>{{ eyebrow() }}</p> }
    <h1>{{ title() }}</h1>
    @if (subtitle()) { <span>{{ subtitle() }}</span> }
  </div>

  @if (metrics().length) {
    <dl class="exercise-summary__metrics" aria-label="Exercise results">
      @for (metric of metrics(); track metric.label) {
        <div class="exercise-summary__metric">
          <dt>{{ metric.label }}</dt>
          <dd>{{ metric.value }}</dd>
          @if (metric.detail) { <span>{{ metric.detail }}</span> }
        </div>
      }
    </dl>
  }

  <div class="exercise-summary__detail">
    <ng-content select="[exerciseSummaryDetail]"></ng-content>
  </div>
</section>
