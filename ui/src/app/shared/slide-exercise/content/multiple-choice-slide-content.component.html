@if (content(); as data) {
  <article class="multiple-choice-slide" data-testid="multiple-choice-slide-content">
    <div class="multiple-choice-slide__copy">
      <p>{{ data.instruction }}</p>
      <div class="d-flex align-items-center gap-2">
        <h1>{{ data.prompt }}</h1>
        <button
          mat-icon-button
          type="button"
          class="text-primary"
          [attr.aria-label]="'Play pronunciation for ' + data.prompt"
          (click)="playPronunciation()"
        >
          <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 10v4h4l5 4V6L8 10H4Z" fill="currentColor"/>
            <path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="multiple-choice-slide__options" role="radiogroup" aria-label="Answer options">
      @for (option of data.options; track option.id; let index = $index) {
        <button
          type="button"
          class="multiple-choice-option"
          role="radio"
          [attr.data-state]="optionState(option.id)"
          [attr.aria-checked]="selectedOptionId() === option.id"
          [disabled]="checked()"
          (click)="selectOption(option.id)"
        >
          <span class="multiple-choice-option__marker" aria-hidden="true">{{ index + 1 }}</span>
          <span>{{ option.label }}</span>
        </button>
      }
    </div>
  </article>
}
