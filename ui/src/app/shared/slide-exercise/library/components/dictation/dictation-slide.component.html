@if (content(); as data) {
	<article class="slide-type" data-testid="dictation-slide">
		@if (data.stimulus) {
			<app-slide-stimulus [stimulus]="data.stimulus" />
		}
		<section class="slide-interaction">
			<p class="slide-instruction">
				{{ data.instruction || 'Listen and type what you hear.' }}
			</p>
			@if (data.audio) {
				<app-slide-audio-control
					[src]="data.audio"
					[maxReplays]="data.maxReplays"
					buttonLabel="Play audio"
					playLabel="Play dictation audio"
					audioLabel="Dictation audio"
					(replayCountChange)="replayCount.set($event)"
				/>
			} @else if (data.speech?.replay) {
				<div class="dictation-audio-actions" role="group" aria-label="Dictation pronunciation controls">
					<button
						mat-flat-button
						class="vocora-audio-action vocora-audio-action--large"
						type="button"
						[disabled]="!canReplay()"
						aria-label="Play dictation pronunciation"
						data-testid="dictation-play-normal"
						(click)="playSpeech()"
					>
						<img src="/assets/icons/normal-speed.svg" alt="" aria-hidden="true" />
					</button>
					<button
						mat-flat-button
						class="vocora-audio-action"
						type="button"
						[disabled]="!canReplay()"
						aria-label="Play dictation pronunciation slowly"
						data-testid="dictation-play-slow"
						(click)="playSpeech('slow')"
					>
						<img src="/assets/icons/slow-speed.svg" alt="" aria-hidden="true" />
					</button>
				</div>
			}
			<mat-form-field
				class="vocora-form-field--soft"
				appearance="outline"
				subscriptSizing="dynamic"
				[attr.data-state]="answerState()"
				><textarea
					class="dictation-answer-input"
					matInput
					[value]="answer()"
					[disabled]="interactionState() !== 'idle'"
					placeholder="Your answer"
					aria-label="Your answer"
					autocomplete="off"
					lang="en"
					aria-multiline="false"
					enterkeyhint="go"
					wrap="off"
					rows="1"
					autocapitalize="none"
					autocorrect="off"
					spellcheck="false"
					(input)="setAnswer(inputFrom($event))"
				></textarea></mat-form-field>
			<div
				class="answer-review"
				[class.answer-review--hidden]="
					interactionState() !== 'answered-incorrect'
				"
			>
				<strong>Answer</strong>
				<p>{{ data.answer }}</p>
			</div>
		</section>
	</article>
}
