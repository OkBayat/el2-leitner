<div class="slide-content-host" [attr.aria-busy]="rendererLoading" data-testid="slide-content-host">
  <ng-template #outlet></ng-template>

  @if (rendererLoading) {
    <div class="slide-content-host__status" role="status">
      <span class="slide-content-host__spinner" aria-hidden="true"></span>
      <span>Preparing slide…</span>
    </div>
  } @else if (unsupportedType) {
    <div class="slide-content-host__status slide-content-host__status--error" role="alert">
      <strong>Unsupported slide</strong>
      <span>No renderer is registered for “{{ unsupportedType }}”.</span>
      <button
        mat-stroked-button
        type="button"
        class="vocora-button vocora-button--secondary"
        data-testid="skip-unavailable-slide"
        aria-label="Skip the unavailable slide"
        (click)="requestSkip()"
      >Skip</button>
    </div>
  } @else if (rendererLoadFailed) {
    <div class="slide-content-host__status slide-content-host__status--error" role="alert">
      <strong>Slide could not load</strong>
      <div class="d-flex flex-wrap justify-content-center gap-3">
        <button
          mat-flat-button
          type="button"
          class="vocora-button vocora-button--primary"
          (click)="retry()"
        >Try again</button>
        <button
          mat-stroked-button
          type="button"
          class="vocora-button vocora-button--secondary"
          data-testid="skip-unavailable-slide"
          aria-label="Skip the unavailable slide"
          (click)="requestSkip()"
        >Skip</button>
      </div>
    </div>
  }
</div>
