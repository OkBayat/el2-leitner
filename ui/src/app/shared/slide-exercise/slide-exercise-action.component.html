<ng-template #content>
  @if (loading()) { <span class="slide-exercise-action__spinner" aria-hidden="true"></span> }
  <span class="slide-exercise-action__label"><ng-content></ng-content></span>
</ng-template>

@switch (tone()) {
  @case ('secondary') {
    <voco-secondary-button class="slide-exercise-action w-100" type="button" [attr.data-state]="state()"
      [ariaLabel]="ariaLabel() || null" [ariaBusy]="loading() ? 'true' : null" [disabled]="disabled() || loading()"
      (activated)="activate()"><ng-container [ngTemplateOutlet]="content" /></voco-secondary-button>
  }
  @case ('success') {
    <voco-success-button class="slide-exercise-action w-100" type="button" [attr.data-state]="state()"
      [ariaLabel]="ariaLabel() || null" [ariaBusy]="loading() ? 'true' : null" [disabled]="disabled() || loading()"
      (activated)="activate()"><ng-container [ngTemplateOutlet]="content" /></voco-success-button>
  }
  @case ('warning') {
    <voco-warning-button class="slide-exercise-action w-100" type="button" [attr.data-state]="state()"
      [ariaLabel]="ariaLabel() || null" [ariaBusy]="loading() ? 'true' : null" [disabled]="disabled() || loading()"
      (activated)="activate()"><ng-container [ngTemplateOutlet]="content" /></voco-warning-button>
  }
  @case ('error') {
    <voco-error-button class="slide-exercise-action w-100" type="button" [attr.data-state]="state()"
      [ariaLabel]="ariaLabel() || null" [ariaBusy]="loading() ? 'true' : null" [disabled]="disabled() || loading()"
      (activated)="activate()"><ng-container [ngTemplateOutlet]="content" /></voco-error-button>
  }
  @default {
    <voco-primary-button class="slide-exercise-action w-100" type="button" [attr.data-state]="state()"
      [ariaLabel]="ariaLabel() || null" [ariaBusy]="loading() ? 'true' : null" [disabled]="disabled() || loading()"
      (activated)="activate()"><ng-container [ngTemplateOutlet]="content" /></voco-primary-button>
  }
}
