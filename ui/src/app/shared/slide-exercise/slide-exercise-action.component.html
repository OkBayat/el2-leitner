<voco-primary-button
	class="slide-exercise-action"
	type="button"
	[attr.data-state]="state()"
	[ariaLabel]="ariaLabel() || null"
	[ariaBusy]="loading() ? 'true' : null"
	[disabled]="state() === 'disabled'"
	(click)="activate()"
>
  @if (loading()) { <span class="slide-exercise-action__spinner" aria-hidden="true"></span> }
  <span class="slide-exercise-action__label"><ng-content></ng-content></span>
</voco-primary-button>
