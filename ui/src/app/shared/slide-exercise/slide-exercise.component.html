@if (currentSlide; as slide) {
  @if (presentation; as view) {
    <section class="slide-exercise" [attr.data-slide-type]="slide.type" data-testid="slide-exercise">
      @if (view.header.visible) {
        <app-slide-exercise-header [progress]="view.header.progress" (close)="close.emit()" />
      }

      <main class="slide-exercise__stage">
        <div class="slide-exercise__content">
          <app-slide-content-host
            [slide]="slide"
            [registry]="registry"
            (stateChange)="onContentState($event)"
          />
        </div>
      </main>

      @if (view.footer.visible) {
        <app-slide-exercise-footer
          [tone]="view.footer.tone"
          [title]="view.footer.title"
          [detail]="view.footer.detail"
        >
          @if (view.footer.secondary; as secondary) {
            <app-slide-exercise-action
              [tone]="secondary.tone"
              [disabled]="secondary.disabled"
              [loading]="secondary.loading"
              [ariaLabel]="secondary.ariaLabel"
              (pressed)="handleAction(secondary, 'secondary')"
            >{{ secondary.label }}</app-slide-exercise-action>
          }
          @if (view.footer.primary; as primary) {
            <app-slide-exercise-action
              [tone]="primary.tone"
              [disabled]="primary.disabled"
              [loading]="primary.loading"
              [ariaLabel]="primary.ariaLabel"
              (pressed)="handleAction(primary, 'primary')"
            >{{ primary.label }}</app-slide-exercise-action>
          }
        </app-slide-exercise-footer>
      }
    </section>
  }
}
