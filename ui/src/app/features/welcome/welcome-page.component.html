<main class="welcome-page">
  <header class="welcome-header">
    <img src="/assets/vocora-logo.png" alt="Vocora" width="185" height="46" />
    @if (!isLast()) {
      <button
        mat-button
        type="button"
        data-testid="welcome-skip"
        (click)="finish()"
      >
        Skip tour
      </button>
    }
  </header>

  <section
    class="welcome-slide"
    data-testid="welcome-slide"
    [attr.aria-labelledby]="'welcome-title-' + currentIndex()"
  >
    <div class="illustration-panel">
      <img
        class="welcome-illustration"
        data-testid="welcome-illustration"
        [src]="slide().illustrationSrc"
        [alt]="slide().illustrationAlt"
        width="500"
        height="375"
        loading="eager"
        decoding="async"
        draggable="false"
      />
    </div>

    <div class="welcome-copy" aria-live="polite">
      <span class="eyebrow"
        >Step {{ currentIndex() + 1 }} of {{ slides.length }} ·
        {{ slide().eyebrow }}</span
      >
      <h1 #welcomeTitle tabindex="-1" [id]="'welcome-title-' + currentIndex()">
        {{ slide().title }}
      </h1>
      <p class="description">{{ slide().description }}</p>
      <p class="detail">{{ slide().detail }}</p>
    </div>
  </section>

  <footer class="welcome-controls">
    <div class="back-slot">
      @if (!isFirst()) {
        <button
          mat-button
          type="button"
          data-testid="welcome-back"
          (click)="previous()"
        >
          Back
        </button>
      }
    </div>

    <nav class="step-navigation" aria-label="Welcome tour steps">
      @for (item of slides; track item.title; let index = $index) {
        <button
          mat-icon-button
          type="button"
          class="step-button"
          data-testid="welcome-step"
          [class.active]="index === currentIndex()"
          [attr.aria-label]="'Go to step ' + (index + 1) + ': ' + item.eyebrow"
          [attr.aria-current]="index === currentIndex() ? 'step' : null"
          (click)="goTo(index)"
        >
          <span class="step-dot"></span>
        </button>
      }
    </nav>

    @if (isLast()) {
      <button
        mat-flat-button
        type="button"
        data-testid="welcome-finish"
        (click)="finish()"
      >
        Go to home
      </button>
    } @else {
      <button
        mat-flat-button
        type="button"
        data-testid="welcome-next"
        (click)="next()"
      >
        Next
      </button>
    }
  </footer>
</main>
