@if (badge(); as context) {
	<div
		class="review-context-badge"
		[attr.data-context]="context.kind"
		data-testid="review-context-badge"
		aria-live="polite">
		<span class="review-context-badge-icon" aria-hidden="true">
			@switch (context.icon) {
				@case ('mistake') {
					<svg viewBox="0 0 24 24">
						<path d="M7.4 7H4V3.6M4.5 6.8A8 8 0 0 1 18.6 5.5" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
						<path d="M16.6 17H20v3.4M19.5 17.2A8 8 0 0 1 5.4 18.5" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
					</svg>
				}
				@case ('memory') {
					<svg viewBox="0 0 24 24">
						<path d="M9.2 18.2V16.4C7.3 15.4 6 13.4 6 11.1A6 6 0 0 1 18 11c0 2.1-1.1 4-2.8 5.1v2.1" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
						<path d="M9.3 20.5h5.4M10 8.8c.7-1 1.8-1.5 3-1.3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
					</svg>
				}
				@case ('recheck') {
					<svg viewBox="0 0 24 24">
						<path d="M6.2 8.2A7.2 7.2 0 0 1 18 6.4L20 8.5M20 4.8v3.7h-3.7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
						<path d="M17.8 15.8A7.2 7.2 0 0 1 6 17.6L4 15.5M4 19.2v-3.7h3.7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
					</svg>
				}
				@case ('copy') {
					<svg viewBox="0 0 24 24">
						<rect x="8" y="7" width="10" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2.2"/>
						<path d="M15 7V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
					</svg>
				}
			}
		</span>
		<span>{{ context.label }}</span>
	</div>
}
