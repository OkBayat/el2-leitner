<main class="lesson-podcast-page" [attr.aria-busy]="loading()">
  <header class="lesson-podcast-page__header">
    <voco-icon-link
			class="lesson-podcast-page__header-action"
			data-testid="lesson-podcast-back"
			[routerLink]="['/learning-paths', pathId()]"
			aria-label="Back to Learning Path"
		>
      <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <path d="M27 16H6m8-8-8 8 8 8" />
      </svg>
    </voco-icon-link>

    <h1>{{ pageTitle() }}</h1>

    <span class="lesson-podcast-page__header-placeholder" aria-hidden="true"></span>
  </header>

  <section class="lesson-podcast-page__content">
    @if (loading()) {
      <p aria-live="polite">Loading lesson audio…</p>
    } @else if (error()) {
      <div class="lesson-podcast-page__error" role="alert">
        <h2>Lesson audio unavailable</h2>
        <p>{{ error() }}</p>
        <voco-primary-button type="button" (click)="retry()"
					>Try again</voco-primary-button>
      </div>
    } @else if (lesson()) {
      <app-listening-audio-player
        [src]="audioSrc()"
        [title]="pageTitle()"
        description=""
        [collapseOnScroll]="false"
        mode="immersive"
      />
    }
  </section>
</main>
