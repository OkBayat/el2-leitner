<section class="slide-base-exercise" data-testid="slide-base-exercise" [attr.aria-busy]="busy()">
  @if (slides().length) {
    <app-slide-exercise
      [slides]="slides()"
      [defaults]="chromeDefaults()"
      [registry]="registry"
      [environment]="runtime()"
      (close)="cancel()"
      (action)="onAction($event)"
    />
  } @else {
    <div class="slide-base-exercise__error" role="alert">
      <h1>Exercise unavailable</h1>
      <p>{{ error() || 'This exercise could not be prepared.' }}</p>
    </div>
  }
</section>
