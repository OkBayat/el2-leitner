<section class="intake" data-testid="vocabulary-intake" [attr.aria-busy]="busy()">
  @if (slides().length) {
    <app-slide-exercise
      [slides]="slides()"
      [defaults]="chromeDefaults()"
      (close)="cancel()"
      (action)="onAction($event)"
      (contentEvent)="onContentEvent($event)"
      (completed)="complete()"
    />
  } @else {
    <div class="intake__empty" role="alert">
      <h1>Vocabulary unavailable</h1>
      <p>{{ error() || 'This exercise could not be prepared.' }}</p>
    </div>
  }
</section>
