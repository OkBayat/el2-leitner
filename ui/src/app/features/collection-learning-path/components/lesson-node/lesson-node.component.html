<article class="lesson" [attr.data-state]="lesson().state">
  <div class="lesson__rail" aria-hidden="true">
    <span class="lesson__badge">{{ lesson().position }}</span>
    <span class="lesson__line"></span>
  </div>

  <div class="lesson__body">
    <header class="lesson__header">
      <div>
        <p>Lesson {{ lesson().position }}</p>
        <h2>{{ lesson().title }}</h2>
      </div>
      <span class="lesson__state">{{ stateLabel() }}</span>
    </header>

    <div class="lesson__exercises" [attr.aria-label]="lesson().title + ' exercises'">
      @for (exercise of lesson().exercises; track exercise.id) {
        <app-learning-path-exercise-node [exercise]="exercise" (activate)="select($event)" />
      } @empty {
        <p class="lesson__empty">No published exercises yet.</p>
      }
    </div>
  </div>
</article>
