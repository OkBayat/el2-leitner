<article
  class="lesson"
  [attr.data-state]="lesson().state"
  [attr.data-palette]="palette()"
  [class.is-mirrored]="mirrored()"
>
  <div class="lesson__trail" data-testid="lesson-trail">
    <ol class="lesson__exercises" [attr.aria-label]="lesson().title + ' exercises'">
      @for (exercise of lesson().exercises; track exercise.id) {
        <li class="lesson__exercise-row">
          <app-learning-path-exercise-node
            [exercise]="exercise"
            [showStart]="exercise.id === startExerciseId()"
            (activate)="select($event)"
          />
        </li>
      } @empty {
        <li class="lesson__empty">No published exercises yet.</li>
      }
    </ol>
  </div>
</article>
