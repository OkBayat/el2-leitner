<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>Vocora</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="Daily IELTS vocabulary review with pronunciation, mistake rechecks, and a Leitner learning system.">
  <meta name="application-name" content="Vocora">
  <meta name="color-scheme" content="light dark">
  <!-- Theme colors are synchronized from Layer A by tools/sync-first-paint-theme-colors.mjs. -->
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" data-vocora-theme="light">
  <meta name="theme-color" content="#0f1611" media="(prefers-color-scheme: dark)" data-vocora-theme="dark">
  <script src="/theme-bootstrap.js"></script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Vocora">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <meta name="msapplication-TileColor" content="#48BF68">
  <link rel="manifest" href="/vocora-v4.webmanifest">
  <link rel="icon" href="/assets/icons/vocora-v2-favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/vocora-v2-favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/vocora-v2-favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/vocora-v2-apple-touch-180.png">
</head>
<body>
  <app-root></app-root>
  <noscript>Vocora needs JavaScript to run.</noscript>
</body>
</html>
